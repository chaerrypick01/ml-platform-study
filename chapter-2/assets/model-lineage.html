<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font-family:system-ui,sans-serif;color:#17243b;margin:0;padding:24px;background:#f7f9fc}h1{font-size:24px}h2{font-size:19px}section{background:white;border:1px solid #dce3ee;border-radius:16px;padding:20px;margin:18px 0}svg{width:100%;height:auto}svg text{font:15px system-ui,sans-serif;fill:#17243b}svg .small{font-size:12px;fill:#52637b}p{font-size:14px;line-height:1.7;color:#52637b}</style><section><h2>재현성과 리니지</h2><svg viewBox="0 0 940 380" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><path d="M120,80 L460,160" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M460,80 L460,160" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800,80 L460,160" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M460,220 L460,290" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="20" y="20" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="120" y="45" text-anchor="middle">데이터 버전</text><text x="120" y="66" text-anchor="middle" class="small">원본·전처리 이력</text><rect x="360" y="20" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="460" y="45" text-anchor="middle">코드·환경 버전</text><text x="460" y="66" text-anchor="middle" class="small">commit · 의존성</text><rect x="700" y="20" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="800" y="45" text-anchor="middle">학습 설정</text><text x="800" y="66" text-anchor="middle" class="small">하이퍼파라미터 · seed</text><rect x="360" y="160" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="460" y="185" text-anchor="middle">실험 Run</text><text x="460" y="206" text-anchor="middle" class="small">입력 · 지표 · 산출물 기록</text><rect x="360" y="290" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="460" y="315" text-anchor="middle">등록 모델 → 배포 버전</text><text x="460" y="336" text-anchor="middle" class="small">어디에 배포됐는지 연결</text></svg><p>문제가 생긴 배포 버전에서 실험과 원본까지 거슬러 올라가고, 잘못된 데이터가 영향을 준 모델도 찾아낸다. 기록만으로 비트 단위 재현이 보장되지는 않는다.</p></section></html>
