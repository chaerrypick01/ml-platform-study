<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font-family:system-ui,sans-serif;color:#17243b;margin:0;padding:24px;background:#f7f9fc}h1{font-size:24px}h2{font-size:19px}section{background:white;border:1px solid #dce3ee;border-radius:16px;padding:20px;margin:18px 0}svg{width:100%;height:auto}svg text{font:15px system-ui,sans-serif;fill:#17243b}svg .small{font-size:12px;fill:#52637b}p{font-size:14px;line-height:1.7;color:#52637b}</style><section><h2>모니터링에서 재훈련으로</h2><svg viewBox="0 0 940 280" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><path d="M220,50 L360,50" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M560,50 L700,50" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800,80 L800,180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M900,210 L360,210" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M900,210 L20,210" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="20" y="20" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="120" y="45" text-anchor="middle">운영 신호 감지</text><text x="120" y="66" text-anchor="middle" class="small">분포 변화 · 품질 저하</text><rect x="360" y="20" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="460" y="45" text-anchor="middle">원인 분석</text><text x="460" y="66" text-anchor="middle" class="small">장애 / 데이터 / 모델</text><rect x="700" y="20" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="800" y="45" text-anchor="middle">개선 후보 학습</text><text x="800" y="66" text-anchor="middle" class="small">필요할 때 재훈련</text><rect x="700" y="180" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="800" y="205" text-anchor="middle">데이터·모델 검증</text><text x="800" y="226" text-anchor="middle" class="small">기존 모델과 비교</text><rect x="360" y="180" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="460" y="205" text-anchor="middle">통과 → 점진 배포</text><text x="460" y="226" text-anchor="middle" class="small">관찰 후 확대</text><rect x="20" y="180" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="120" y="205" text-anchor="middle">실패 → 기존 모델 유지</text><text x="120" y="226" text-anchor="middle" class="small">수정 후 재시도</text></svg><p>드리프트 알림은 조사 신호다. 곧바로 성능 저하나 재훈련 필요를 뜻하지 않으며, 새 모델도 검증을 통과해야 배포한다.</p></section></html>
