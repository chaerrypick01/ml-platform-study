apiVersion: v1
kind: Namespace
metadata:
  name: ch6-serving
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: income-classifier
  namespace: ch6-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: none
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    enableServiceLinks: false
    containers:
      - name: kserve-container
        image: ch6-income:lab-v2
        imagePullPolicy: IfNotPresent
        ports:
          - name: http1
            containerPort: 3000
        env:
          - name: BENTOML_DO_NOT_TRACK
            value: "True"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
