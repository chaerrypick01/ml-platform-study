<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:14px system-ui,sans-serif;margin:0;padding:18px;color:#17243b}svg{width:100%;height:auto}text{font:15px system-ui,sans-serif;fill:#17243b}.sub{font-size:12px;fill:#52637b}p{line-height:1.6;color:#52637b}</style><svg viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prometheus가 앱의 메트릭을 수집하고 Grafana가 Prometheus를 조회"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect x="10" y="50" width="230" height="85" rx="12" fill="#eaf1ff"/><text x="125" y="82" text-anchor="middle">애플리케이션</text><text x="125" y="110" text-anchor="middle" class="sub">계측 → /metrics 노출</text><rect x="335" y="50" width="230" height="85" rx="12" fill="#eff8f4"/><text x="450" y="82" text-anchor="middle">Prometheus</text><text x="450" y="110" text-anchor="middle" class="sub">주기적 수집 · 시계열 저장</text><rect x="660" y="50" width="230" height="85" rx="12" fill="#fff8e9"/><text x="775" y="82" text-anchor="middle">Grafana</text><text x="775" y="110" text-anchor="middle" class="sub">조회 · 대시보드 시각화</text><path d="M335 90H245" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="287" y="70" text-anchor="middle" class="sub">scrape 요청</text><path d="M660 90H570" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="612" y="70" text-anchor="middle" class="sub">쿼리 요청</text><text x="450" y="170" text-anchor="middle" class="sub">화살표는 요청 방향. 수집된 지표와 조회 결과는 반대 방향으로 돌아온다.</text></svg><p>/metrics 노출과 별도로 Prometheus에 수집 대상을 설정해야 한다.</p></html>
