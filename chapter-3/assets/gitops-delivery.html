<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font-family:system-ui,sans-serif;color:#17243b;margin:0;padding:24px;background:#f7f9fc}h1{font-size:24px}h2{font-size:19px}section{background:white;border:1px solid #dce3ee;border-radius:16px;padding:20px;margin:18px 0}svg{width:100%;height:auto}svg text{font:15px system-ui,sans-serif;fill:#17243b}svg .small{font-size:12px;fill:#52637b}p{font-size:14px;line-height:1.7;color:#52637b}</style><section><h2>CI와 CD의 연결</h2><svg viewBox="0 0 940 390" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><path d="M220,50 L360,50" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M560,50 L700,50" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M460,80 L460,170" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M460,230 L120,300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M220,330 L700,330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800,80 L800,300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="20" y="20" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="120" y="45" text-anchor="middle">개발자 코드 Push</text><text x="120" y="66" text-anchor="middle" class="small">Git 저장소</text><rect x="360" y="20" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="460" y="45" text-anchor="middle">CI Runner</text><text x="460" y="66" text-anchor="middle" class="small">테스트 → 이미지 빌드</text><rect x="700" y="20" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="800" y="45" text-anchor="middle">이미지 레지스트리</text><text x="800" y="66" text-anchor="middle" class="small">commit 태그 / digest</text><rect x="360" y="170" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="460" y="195" text-anchor="middle">Git 배포 설정 갱신</text><text x="460" y="216" text-anchor="middle" class="small">Helm values의 이미지 버전</text><rect x="20" y="300" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="120" y="325" text-anchor="middle">Argo CD</text><text x="120" y="346" text-anchor="middle" class="small">Git과 클러스터 상태 비교</text><rect x="700" y="300" width="200" height="60" rx="12" fill="#eaf1ff" stroke="#bdcce4"/><text x="800" y="325" text-anchor="middle">Kubernetes</text><text x="800" y="346" text-anchor="middle" class="small">설정 반영 · 이미지 Pull</text></svg><p>이미지는 레지스트리에, 원하는 배포 상태는 Git에 저장한다. Argo CD가 배포 설정을 동기화하고 Kubernetes가 이미지를 받아 실행한다. 자동 동기화 여부는 설정에 달려 있다.</p></section></html>
