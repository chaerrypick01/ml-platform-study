<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:15px system-ui,sans-serif;color:#17243b;padding:16px}svg{width:100%;height:auto}text{font:15px system-ui,sans-serif;fill:#17243b}.sub{font-size:12px;fill:#52637b}rect{fill:#eaf1ff;stroke:#bdcce4}path{stroke:#64748b;stroke-width:2;fill:none}p{line-height:1.7;color:#52637b}</style><h2>피처 스토어와 모델 레지스트리</h2><svg viewBox="0 0 940 350" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#64748b"/></marker></defs><path d="M460 70L120 130" marker-end="url(#arrow)"/><path d="M460 70L800 130" marker-end="url(#arrow)"/><path d="M120 190L120 250" marker-end="url(#arrow)"/><path d="M800 190L800 250" marker-end="url(#arrow)"/><path d="M220 280L360 280" marker-end="url(#arrow)"/><path d="M560 280L700 280" marker-end="url(#arrow)"/><rect x="360" y="10" width="200" height="60" rx="12"/><text x="460" y="35" text-anchor="middle">피처 정의·계산</text><text class="sub" x="460" y="56" text-anchor="middle">예: 최근 7일 결제액</text><rect x="20" y="130" width="200" height="60" rx="12"/><text x="120" y="155" text-anchor="middle">오프라인 스토어</text><text class="sub" x="120" y="176" text-anchor="middle">과거 시점 기준 피처</text><rect x="700" y="130" width="200" height="60" rx="12"/><text x="800" y="155" text-anchor="middle">온라인 스토어</text><text class="sub" x="800" y="176" text-anchor="middle">요청 시점 피처 조회</text><rect x="20" y="250" width="200" height="60" rx="12"/><text x="120" y="275" text-anchor="middle">학습·평가</text><text class="sub" x="120" y="296" text-anchor="middle">학습 데이터로 모델 생성</text><rect x="360" y="250" width="200" height="60" rx="12"/><text x="460" y="275" text-anchor="middle">모델 레지스트리</text><text class="sub" x="460" y="296" text-anchor="middle">모델 버전·메타데이터</text><rect x="700" y="250" width="200" height="60" rx="12"/><text x="800" y="275" text-anchor="middle">모델 서빙</text><text class="sub" x="800" y="296" text-anchor="middle">선택한 모델로 예측</text></svg><p>피처 스토어는 학습과 서빙에 필요한 입력을 지원하고, 모델 레지스트리는 학습 결과인 모델의 버전과 메타데이터를 관리한다. 학습·서빙이 같은 물리 저장소를 읽는다는 뜻은 아니다.</p></html>
